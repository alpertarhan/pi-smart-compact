name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR cancels the superseded run; main and scheduled runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        # Pin to the exact version declared in package.json#packageManager so
        # CI reproduces local builds deterministically (audit P0 #3).
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        # --frozen-lockfile catches accidental drift between bun.lock and
        # package.json on PRs.
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        # Same advisory gate as publish.yml, so a new advisory fails a PR or the
        # daily run instead of the release.
        run: bun audit

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test
      - name: Adversarial gate
        run: bun run gate
      - name: Hot-path benchmark gate
        run: bun run bench
      - name: Build
        run: bun run build

      - name: Install ripgrep
        # The audit's offline task-eval drives Pi's grep tool; without `rg` on
        # PATH Pi would download it from GitHub, which the offline guard rejects.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - name: Packed artifact and frozen-install audit
        run: bun run release:audit

  pi-latest:
    name: pi latest compatibility
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Install locked baseline
        run: bun install --frozen-lockfile

      - name: Test against latest Pi
        run: bun run compat:pi

  scheduled-failure:
    name: report scheduled failure
    # A red scheduled run otherwise only emails one person and went unseen for days.
    needs: [verify, pi-latest]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Scheduled CI failed"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "$title" --body "The scheduled CI run failed: $RUN_URL. Close this issue once main is green again."
          fi
