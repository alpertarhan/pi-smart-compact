name: Bug report
description: Report a reproducible Pi Continuity (pi-smart-compact) problem
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include enough context to reproduce the issue without sharing secrets or private session content. Report vulnerabilities privately through GitHub Security Advisories instead (see SECURITY.md). Home › Status & help › Readiness & details shows local readiness and effective settings without contacting a provider.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened? What did you expect to happen?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: pi-smart-compact version
      description: Shown in the `/smart-compact` command description. Say whether it is an npm release or a source checkout.
      placeholder: "e.g. 9.7.1 from npm"
    validations:
      required: true
  - type: input
    id: pi-version
    attributes:
      label: Pi Coding Agent version
      placeholder: "0.87.1"
    validations:
      required: false
  - type: dropdown
    id: surface
    attributes:
      label: Integration surface
      options:
        - /smart-compact Home or subcommand
        - automatic compaction (native-hook, settled or background)
        - smart_compact tool
        - smart_context tool, cleanup or archived output
        - smart_navigation tool or navigation panel
        - smart_tools loader
        - memory (smart_recall, smart_save_memory, backend)
        - provider-native compaction engine
        - visual evidence
        - RTK companion
        - metrics/dashboard/storage report
        - install/build/optional components
        - other
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Configure ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Relevant configuration
      description: Paste only non-secret `smartCompact` settings.
      render: json
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Redact tokens, private repository content, and confidential session data.
      render: shell
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        OS:
        Bun:
        Node:
        Model/provider:
        Memory backend (local, hindsight, mnemopi):
        Other context or compaction extensions loaded:
    validations:
      required: false
